<text x="219.8" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#f2f2f2">T</text><text x="233.2" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#f2f2f2">O</text><text x="246.6" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#f2f2f2">O</text><text x="260.0" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#f2f2f2">L</text><text x="273.4" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#f2f2f2">K</text><text x="286.8" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#f2f2f2">I</text><text x="300.2" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#f2f2f2">T</text>
<text x="260" y="123" text-anchor="middle" font-size="8.6" fill="#9a9aa0">Ten standalone tools for pentest, DFIR and SOC work. Pure Python. No dependencies.</text>
<rect x="25" y="135" width="470" height="0.8" fill="#e5232f" opacity=".6"/>
<rect x="25" y="148" width="232" height="70" rx="4" fill="#161618" stroke="#2c1d20" stroke-width="0.8"/><rect x="25" y="148" width="2" height="70" fill="#e5232f"/>
<text x="34" y="165" font-size="9.5" fill="#e5232f" font-weight="700">01</text><text x="52" y="165" font-size="11.5" font-weight="800" fill="#f4f4f4">SCAROSINT</text>
<rect x="220.5" y="156" width="30.5" height="11" rx="2" fill="none" stroke="#e5232f" stroke-width=".7"/><text x="235.75" y="164" text-anchor="middle" font-size="5.8" fill="#e5232f">RECON</text>
<text x="34" y="182" font-size="6.9" fill="#d0d0d4">Keyless domain recon: DNS, subdomains, WHOIS, TLS,</text><text x="34" y="192" font-size="6.9" fill="#d0d0d4">headers, archives.</text>
<rect x="33" y="200" width="216" height="12" rx="2" fill="#08080a"/><text x="37" y="208.5" font-size="6.2" fill="#3fd68f">$ SCAROSINT example.com --json --no-save</text>
<rect x="263" y="148" width="232" height="70" rx="4" fill="#161618" stroke="#2c1d20" stroke-width="0.8"/><rect x="263" y="148" width="2" height="70" fill="#e5232f"/>
<text x="272" y="165" font-size="9.5" fill="#e5232f" font-weight="700">02</text><text x="290" y="165" font-size="11.5" font-weight="800" fill="#f4f4f4">SCARREPORT</text>
<rect x="454.2" y="156" width="34.8" height="11" rx="2" fill="none" stroke="#e5232f" stroke-width=".7"/><text x="471.6" y="164" text-anchor="middle" font-size="5.8" fill="#e5232f">REPORT</text>
<text x="272" y="182" font-size="6.9" fill="#d0d0d4">Turns SCAROSINT JSON into a clean HTML and Markdown</text><text x="272" y="192" font-size="6.9" fill="#d0d0d4">report.</text>
<rect x="271" y="200" width="216" height="12" rx="2" fill="#08080a"/><text x="275" y="208.5" font-size="6.2" fill="#3fd68f">$ scarreport report.json -o reports/</text>
<rect x="25" y="225" width="232" height="70" rx="4" fill="#161618" stroke="#2c1d20" stroke-width="0.8"/><rect x="25" y="225" width="2" height="70" fill="#e5232f"/>
<text x="34" y="242" font-size="9.5" fill="#e5232f" font-weight="700">03</text><text x="52" y="242" font-size="11.5" font-weight="800" fill="#f4f4f4">SCARLAN</text>
<rect x="211.9" y="233" width="39.099999999999994" height="11" rx="2" fill="none" stroke="#e5232f" stroke-width=".7"/><text x="231.45" y="241" text-anchor="middle" font-size="5.8" fill="#e5232f">NETWORK</text>
<text x="34" y="259" font-size="6.9" fill="#d0d0d4">Local network inventory: hosts, ports, possible</text><text x="34" y="269" font-size="6.9" fill="#d0d0d4">exposures, diff.</text>
<rect x="33" y="277" width="216" height="12" rx="2" fill="#08080a"/><text x="37" y="285.5" font-size="6.2" fill="#3fd68f">$ scarlan scan --network 192.168.1.0/24 --i-own-this-net</text>
<rect x="263" y="225" width="232" height="70" rx="4" fill="#161618" stroke="#2c1d20" stroke-width="0.8"/><rect x="263" y="225" width="2" height="70" fill="#e5232f"/>
<text x="272" y="242" font-size="9.5" fill="#e5232f" font-weight="700">04</text><text x="290" y="242" font-size="11.5" font-weight="800" fill="#f4f4f4">SCARNOTE</text>
<rect x="458.5" y="233" width="30.5" height="11" rx="2" fill="none" stroke="#e5232f" stroke-width=".7"/><text x="473.75" y="241" text-anchor="middle" font-size="5.8" fill="#e5232f">NOTES</text>
<text x="272" y="259" font-size="6.9" fill="#d0d0d4">Terminal notes and cheatsheets. Searchable, tagged,</text><text x="272" y="269" font-size="6.9" fill="#d0d0d4">encryptable.</text>
<rect x="271" y="277" width="216" height="12" rx="2" fill="#08080a"/><text x="275" y="285.5" font-size="6.2" fill="#3fd68f">$ scarnote search nmap</text>
<rect x="25" y="302" width="232" height="70" rx="4" fill="#161618" stroke="#2c1d20" stroke-width="0.8"/><rect x="25" y="302" width="2" height="70" fill="#e5232f"/>
<text x="34" y="319" font-size="9.5" fill="#e5232f" font-weight="700">05</text><text x="52" y="319" font-size="11.5" font-weight="800" fill="#f4f4f4">SCARCUSTODY</text>
<rect x="224.8" y="310" width="26.2" height="11" rx="2" fill="none" stroke="#e5232f" stroke-width=".7"/><text x="237.9" y="318" text-anchor="middle" font-size="5.8" fill="#e5232f">DFIR</text>
<text x="34" y="336" font-size="6.9" fill="#d0d0d4">Evidence hashing and a tamper-evident</text><text x="34" y="346" font-size="6.9" fill="#d0d0d4">chain-of-custody log.</text>
<rect x="33" y="354" width="216" height="12" rx="2" fill="#08080a"/><text x="37" y="362.5" font-size="6.2" fill="#3fd68f">$ scarcustody add image.dd -n "desk 3"</text>
<rect x="263" y="302" width="232" height="70" rx="4" fill="#161618" stroke="#2c1d20" stroke-width="0.8"/><rect x="263" y="302" width="2" height="70" fill="#e5232f"/>
<text x="272" y="319" font-size="9.5" fill="#e5232f" font-weight="700">06</text><text x="290" y="319" font-size="11.5" font-weight="800" fill="#f4f4f4">SCARLOG</text>
<rect x="462.8" y="310" width="26.2" height="11" rx="2" fill="none" stroke="#e5232f" stroke-width=".7"/><text x="475.9" y="318" text-anchor="middle" font-size="5.8" fill="#e5232f">DFIR</text>
<text x="272" y="336" font-size="6.9" fill="#d0d0d4">SSH/auth and web log analyzer: brute force,</text><text x="272" y="346" font-size="6.9" fill="#d0d0d4">spraying, probes, timeline.</text>
<rect x="271" y="354" width="216" height="12" rx="2" fill="#08080a"/><text x="275" y="362.5" font-size="6.2" fill="#3fd68f">$ scarlog /var/log/auth.log --year 2026</text>
<rect x="25" y="379" width="232" height="70" rx="4" fill="#161618" stroke="#2c1d20" stroke-width="0.8"/><rect x="25" y="379" width="2" height="70" fill="#e5232f"/>
<text x="34" y="396" font-size="9.5" fill="#e5232f" font-weight="700">07</text><text x="52" y="396" font-size="11.5" font-weight="800" fill="#f4f4f4">SCARIOC</text>
<rect x="199.0" y="387" width="52.0" height="11" rx="2" fill="none" stroke="#e5232f" stroke-width=".7"/><text x="225.0" y="395" text-anchor="middle" font-size="5.8" fill="#e5232f">DFIR / SOC</text>
<text x="34" y="413" font-size="6.9" fill="#d0d0d4">IoC extractor: IPs, domains, URLs, emails, hashes,</text><text x="34" y="423" font-size="6.9" fill="#d0d0d4">CVEs. Defang aware.</text>
<rect x="33" y="431" width="216" height="12" rx="2" fill="#08080a"/><text x="37" y="439.5" font-size="6.2" fill="#3fd68f">$ scarioc -c incident.log</text>
<rect x="263" y="379" width="232" height="70" rx="4" fill="#161618" stroke="#2c1d20" stroke-width="0.8"/><rect x="263" y="379" width="2" height="70" fill="#e5232f"/>
<text x="272" y="396" font-size="9.5" fill="#e5232f" font-weight="700">08</text><text x="290" y="396" font-size="11.5" font-weight="800" fill="#f4f4f4">SCARDECODE</text>
<rect x="445.6" y="387" width="43.4" height="11" rx="2" fill="none" stroke="#e5232f" stroke-width=".7"/><text x="467.3" y="395" text-anchor="middle" font-size="5.8" fill="#e5232f">ANALYSIS</text>
<text x="272" y="413" font-size="6.9" fill="#d0d0d4">Encode, decode, peel layers, read JWTs, identify</text><text x="272" y="423" font-size="6.9" fill="#d0d0d4">hashes, entropy.</text>
<rect x="271" y="431" width="216" height="12" rx="2" fill="#08080a"/><text x="275" y="439.5" font-size="6.2" fill="#3fd68f">$ scardecode magic "VTJGc2RHVmtY..."</text>
<rect x="25" y="456" width="232" height="70" rx="4" fill="#161618" stroke="#2c1d20" stroke-width="0.8"/><rect x="25" y="456" width="2" height="70" fill="#e5232f"/>
