<rect x="211.9" y="464" width="39.099999999999994" height="11" rx="2" fill="none" stroke="#e5232f" stroke-width=".7"/><text x="231.45" y="472" text-anchor="middle" font-size="5.8" fill="#e5232f">PENTEST</text>
<text x="34" y="490" font-size="6.9" fill="#d0d0d4">Engagement tracker: authorization, scope, findings,</text><text x="34" y="500" font-size="6.9" fill="#d0d0d4">evidence, reports.</text>
<rect x="33" y="508" width="216" height="12" rx="2" fill="#08080a"/><text x="37" y="516.5" font-size="6.2" fill="#3fd68f">$ scarengage export ENG-001 --format html</text>
